# Optional reverse proxy for local/staging docker-compose deployments —
# routes a single public origin to both containers (frontend for
# everything, /api and /uploads to the backend) instead of exposing two
# ports. Not used by the production deployment path (Railway/Vercel each
# terminate their own TLS and routing) — see the README's Deployment
# section. To use this locally, add an `nginx` service to
# docker-compose.yml mounting this file read-only at
# /etc/nginx/conf.d/default.conf and publishing port 80.

upstream backend_upstream {
    server backend:4000;
}

upstream frontend_upstream {
    server frontend:3000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 30m; # covers the 25MB audio / 5MB resume upload limits with headroom

    # Backend API
    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Locally-stored resume/audio uploads (StorageService's disk fallback —
    # see storage.service.ts) served directly by the backend
    location /uploads/ {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
    }

    # Everything else -> the Next.js frontend
    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
