# Local/staging orchestration. Build context for both app images is the
# PROJECT ROOT (see the header comments in backend.Dockerfile and
# frontend.Dockerfile for why) — run this file from the project root:
#   docker compose -f docker/docker-compose.yml up --build
#
# Production deployment does NOT use this file — see the README's
# Deployment section (Railway for the backend + Postgres, Vercel for the
# frontend). This compose file is for running the full stack locally
# without installing Postgres/Redis natively, and for CI smoke tests.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_interview_platform
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      API_PREFIX: api/v1
      CORS_ORIGIN: http://localhost:3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ai_interview_platform?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Secrets/API keys: pass via `docker compose --env-file` pointing at
      # a real .env, never hardcoded here. See backend/.env.example for
      # the full list (JWT_ACCESS_SECRET, OPENAI_API_KEY, JUDGE_API_URL, ...).
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change_this_access_secret_change_this_access_secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change_this_refresh_secret_change_this_refresh_secret}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      JUDGE_API_URL: ${JUDGE_API_URL:-}
      JUDGE_API_KEY: ${JUDGE_API_KEY:-}
    ports:
      - '4000:4000'
    volumes:
      - backend_uploads:/app/backend/uploads
    # Applies any pending migrations, then starts the API. Safe to re-run
    # on every container start: `migrate deploy` is a no-op if the
    # database is already up to date. Paths here are relative to the
    # image's WORKDIR (/app/backend — see backend.Dockerfile's final
    # WORKDIR instruction), not the project root.
    command: >
      sh -c "npm run prisma:deploy && node dist/main.js"

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '3000:3000'

  # Optional single-origin reverse proxy — see docker/nginx/nginx.conf's
  # header comment. Not required: backend (4000) and frontend (3000) are
  # already independently reachable above. Start it explicitly with
  # `docker compose -f docker/docker-compose.yml --profile with-nginx up`.
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    profiles: ['with-nginx']
    depends_on:
      - backend
      - frontend
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - '80:80'

volumes:
  postgres_data:
  backend_uploads:
